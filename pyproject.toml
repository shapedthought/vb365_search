[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vb365_search"
version = "0.1.0"
description = "A Python library for searching in Veeam Backup for Microsoft 365 environments"
readme = "README.md"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "requests",
    "fire",
    "pydantic",
    "toml",
]

[project.urls]
"Homepage" = "https://github.com/yourusername/vb365_search"
"Bug Tracker" = "https://github.com/yourusername/vb365_search/issues"

[project.scripts]
vb365 = "vb365_search.cli:main"
